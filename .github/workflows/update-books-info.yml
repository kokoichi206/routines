name: update books information

on:
  workflow_dispatch:
    inputs:
      one_time_folder_ids:
        description: "今回だけ登録する追加フォルダ ID（空白区切り、直下の全ファイル）"
        required: false
        type: string
        default: ""
      dry_run:
        description: "登録予定件数の確認のみ（Notion に書き込まない）"
        required: false
        type: boolean
        default: false
  schedule:
    # 日本時間 23 時 00 分
    - cron: "0 14 * * *"

jobs:
  update-books:
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: book-manager-production
      cancel-in-progress: false
    env:
      DATABASE_ID: ${{ secrets.DATABASE_ID }}
      NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
      ONE_TIME_DRIVE_FOLDER_IDS: ${{ inputs.one_time_folder_ids }}
      BOOK_MANAGER_DRY_RUN: ${{ inputs.dry_run }}
    defaults:
      run:
        shell: bash
        working-directory: ./book_manager/
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: book_manager/.python-version
          architecture: "x64"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.2"
          working-directory: book_manager
      - name: Install dependencies
        run: uv sync --locked --no-dev
      - name: Run main code
        run: uv run --locked --no-dev python -u main.py
