name: action_checker
on:
  # 手動実行できるようにする！
  workflow_dispatch:
  schedule:
    # 日本時間 22 時 00 分
    - cron: '0 13 * * *'

jobs:
  checker:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    defaults:
      run:
        shell: bash
        working-directory: ./action_checker/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.11
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.2"
          working-directory: action_checker
      - name: Install dependencies
        run: uv sync --locked

      - name: Run script
        env:
          # ブラウザで直接アクセスする方法だと未ログイン扱いで UTC の集計になる。
          # GraphQL API + JST ユーザーの PAT（read:user スコープ）なら
          # ログイン済みブラウザと同じ JST ベースの集計が得られる。
          # secrets.GITHUB_TOKEN はユーザーに紐づかないため UTC になり使えない。
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          uv run --locked python events.py \
            "${{ secrets.CHECK_DISCORD_WEBHOOK_URL }}" \
            "${{ secrets.CHECK_USERS }}" \
            "${{ secrets.CHECK_STEPS }}" \
            "${{ secrets.CHECK_IMG_BASE_URL }}" \
            "${{ secrets.CHECK_IMG_URL_BASIC_AUTH_USER }}" \
            "${{ secrets.CHECK_IMG_URL_BASIC_AUTH_PASS }}"

      - name: Report if checker hadn't worked.
        if: failure()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"content": "contributionsの確認が正常に行えませんでした..."}' \
            "${{ secrets.CHECK_DISCORD_WEBHOOK_URL }}"
