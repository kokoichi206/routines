name: book_manager tests

on:
  pull_request:
    paths:
      - book_manager/**
      - .github/workflows/book-manager-test.yml
      - .github/workflows/update-books-info.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: book_manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: book_manager/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.2"
          working-directory: book_manager
      - name: Install test and authorization dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run --locked python -m pytest
      - name: Check authorization script imports
        run: uv run --locked --group auth python scripts/authorize_drive.py --help
      - name: Check production dependencies
        run: |
          uv sync --locked --no-dev
          uv run --locked --no-dev python -c 'import main'
